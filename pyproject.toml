[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N naming, UP pyupgrade,
# B bugbear, SIM simplify, C90 cyclomatic complexity
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
